# Render blueprint: the whole backend as one web service.
# In Render: New > Blueprint > pick this repository. It asks for the values marked
# "sync: false"; they are the same ones a local .env holds (see .env.example).
# The web app itself is served from Cloudflare Pages, which passes API paths here.
services:
  - type: web
    name: trycanari-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: ./deploy/run-all.sh
    plan: free
    # Closest to the database, which is in Mumbai.
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # The values below are safe to keep in the repository. Everything marked
      # "sync: false" is a secret: paste it in Render from .env.production.env.
      - key: APP_ENV
        value: production
      - key: PUBLIC_URL
        value: https://trycanari.pages.dev
      - key: MODEL_BACKEND
        value: real
      - key: WALLET_BACKEND
        value: solana
      - key: INVITE_ONLY
        value: "true"
      - key: PAYMENT_POLL_SECONDS
        value: "15"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SECRET_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: PROXY_SECRET
        sync: false
      - key: MODEL_API_BASE
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: SOLANA_CLUSTER
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: ESCROW_ADDRESS
        sync: false
      - key: SOLANA_SECRET_KEY
        sync: false
      - key: PAYOUT_MAX_ZATOSHI
        sync: false
      - key: PAYOUT_DAILY_MAX_ZATOSHI
        sync: false
      - key: CLOUDINARY_URL
        sync: false
