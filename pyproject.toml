[project]
name = "agentbounty"
version = "0.1.0"
description = "Marketplace for canary-verified attacks on AI agents, paid in SOL on Solana"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "solders>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
# The MCP server a sponsor's editor runs: `uvx --from <this repository> trycanari-mcp`.
trycanari-mcp = "agentbounty.mcp_server:main"

[project.optional-dependencies]
# The browser the MCP server drives over the sponsor's own site (see browser.py). An
# extra because it brings a browser with it: `uv sync --extra browser`, then
# `uv run playwright install chromium`.
browser = ["playwright>=1.47"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbounty"]
# The built web app is ignored by git but belongs in the wheel.
artifacts = ["src/agentbounty/static/app/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import from the source tree, so tests do not depend on the editable install.
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "PT", "T20", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and their canary secrets are fixtures, not credentials.
"tests/**" = ["S101", "S105", "S106"]
# The smoke script is a command-line tool: it prints.
"scripts/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "migrations", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# An extra: it is not installed in every environment (see browser.py).
module = ["playwright.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
